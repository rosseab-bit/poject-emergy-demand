[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: entrena modelos reales o recorre la app completa (más de unos segundos)
    mongo: integración con el cluster real de MongoDB (solo con -m mongo y un .env)

# Suite completa:      pytest
# Subconjunto rápido:  pytest -m "not slow"   (lógica, linter y lo que no entrena)
# Cluster real:        pytest -m mongo        (escribe en una colección temporal)
